<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Left4Addons Catalog Server Admin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    .container { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }
    h1, h2 { margin: 0 0 12px; font-weight: 600; }
    h1 { font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
    h2 { font-size: 16px; color: var(--accent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input, select, button {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }
    button {
      background: #0284c7;
      border-color: #0284c7;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: #334155; border-color: #475569; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .stat { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .val { font-size: 22px; font-weight: 700; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); }
    .badge.flagged { color: var(--warn); border-color: var(--warn); }
    .badge.removed { color: var(--err); border-color: var(--err); }
    .badge.active { color: var(--ok); border-color: var(--ok); }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    #tokenNotice { margin-top: 10px; color: var(--ok); font-size: 13px; word-break: break-all; }
    #scraperBox { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>
        <span>Left4Addons v2 Catalog Server 管理控制台</span>
        <span class="badge active">Axum + SQLite</span>
      </h1>
      <div class="row">
        <input id="adminToken" type="password" placeholder="输入 Admin Token (X-Admin-Token)" style="min-width: 280px;" />
        <button id="btnLoadAll">连接并刷新</button>
      </div>
      <div id="scraperBox" style="margin-top: 10px;"></div>
    </div>

    <div class="card">
      <h2>概览统计</h2>
      <div id="stats" class="stats"></div>
    </div>

    <div class="card">
      <h2>条目检索与状态覆写</h2>
      <div class="row">
        <input id="searchQ" placeholder="按 Workshop ID / 标题搜索" />
        <button id="btnSearch" class="secondary">搜索缓存</button>
      </div>
      <div class="row" style="margin-top: 10px;">
        <input id="ovId" placeholder="Workshop ID" />
        <select id="ovStatus">
          <option value="active">active</option>
          <option value="removed">removed</option>
          <option value="private_or_unavailable">private_or_unavailable</option>
        </select>
        <input id="ovTitle" placeholder="覆盖标题 (可选)" />
        <input id="ovReason" placeholder="操作原因" />
        <button id="btnOverride">强制覆写</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>标题</th><th>状态</th><th>依赖数</th><th>更新时间</th><th>来源</th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>可信玩家与贡献者管理</h2>
      <div class="row">
        <input id="cName" placeholder="玩家/节点名称" />
        <input id="cSteam" placeholder="SteamID (可选)" />
        <select id="cTier">
          <option value="trusted_player">trusted_player (50)</option>
          <option value="maintainer">maintainer (80)</option>
          <option value="official">official (100)</option>
          <option value="community">community (20)</option>
        </select>
        <button id="btnCreateContrib">生成贡献者 Token</button>
      </div>
      <div id="tokenNotice"></div>
      <table>
        <thead><tr><th>名称</th><th>SteamID</th><th>信任层级</th><th>权重</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="contribBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>提交审计与冲突裁决日志 (最近 200 条)</h2>
      <table>
        <thead><tr><th>时间</th><th>Workshop ID</th><th>贡献者</th><th>裁决结果</th><th>提交状态</th><th>说明</th></tr></thead>
        <tbody id="auditBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const tokenInput = document.getElementById('adminToken');
    tokenInput.value = sessionStorage.getItem('l4a_admin_token') || '';

    function saveAndGetToken() {
      const t = tokenInput.value.trim();
      sessionStorage.setItem('l4a_admin_token', t);
      return t;
    }

    async function api(url, opts = {}, sendAdminToken = true) {
      const hdrs = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (sendAdminToken) {
        hdrs['X-Admin-Token'] = saveAndGetToken();
      }
      const res = await fetch(url, { ...opts, headers: hdrs });
      const rawText = await res.text();
      let data = null;
      if (rawText) {
        try {
          data = JSON.parse(rawText);
        } catch {
          data = { error: rawText };
        }
      }
      if (!res.ok) {
        throw new Error((data && data.error) || res.statusText || ('HTTP ' + res.status));
      }
      return data;
    }

    async function loadAll() {
      try {
        const [stats, scraper, contributors, audits] = await Promise.all([
          api('/api/v1/admin/stats'),
          api('/api/v1/admin/scraper/status'),
          api('/api/v1/admin/contributors'),
          api('/api/v1/admin/audit'),
        ]);
        renderStats(stats);
        document.getElementById('scraperBox').textContent =
          `爬虫模块 (${scraper.providerName}, implemented=${scraper.implemented}, queued=${scraper.queuedJobs}): ${scraper.message}`;
        renderContributors(contributors);
        renderAudits(audits);
        await searchItems();
      } catch (e) {
        alert('加载失败: ' + e.message);
      }
    }

    function renderStats(s) {
      const cards = [
        ['缓存总条目', s.totalItems],
        ['活跃条目', s.activeItems],
        ['已下架条目', s.removedItems],
        ['待审阅冲突', s.flaggedAuditsCount],
        ['贡献者数量', s.contributorsCount],
      ];
      document.getElementById('stats').innerHTML = cards.map(
        ([k, v]) => `<div class="stat"><div class="label">${escapeHtml(k)}</div><div class="val">${escapeHtml(v)}</div></div>`
      ).join('');
    }

    async function searchItems() {
      try {
        const q = encodeURIComponent(document.getElementById('searchQ').value.trim());
        const res = await api('/api/v1/items/search?q=' + q, {}, false);
        document.getElementById('itemsBody').innerHTML = res.items.map(it => `
          <tr>
            <td><code>${escapeHtml(it.workshopId)}</code></td>
            <td>${escapeHtml(it.title)}</td>
            <td><span class="badge ${it.status === 'active' ? 'active' : 'removed'}">${escapeHtml(it.status)}</span></td>
            <td>${(it.dependencies || []).length}</td>
            <td>${escapeHtml(it.timeUpdated || '-')}</td>
            <td>${escapeHtml(it.source)}</td>
          </tr>
        `).join('');
      } catch (e) {
        alert('搜索失败: ' + e.message);
      }
    }

    async function overrideItem() {
      try {
        const wid = document.getElementById('ovId').value.trim();
        if (!wid) return alert('请填写 Workshop ID');
        await api('/api/v1/admin/items/' + encodeURIComponent(wid) + '/override', {
          method: 'POST',
          body: JSON.stringify({
            status: document.getElementById('ovStatus').value,
            title: document.getElementById('ovTitle').value.trim() || null,
            reason: document.getElementById('ovReason').value.trim() || null,
          }),
        });
        await loadAll();
      } catch (e) {
        alert('覆写失败: ' + e.message);
      }
    }

    async function createContributor() {
      try {
        const res = await api('/api/v1/admin/contributors', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('cName').value.trim(),
            steamId: document.getElementById('cSteam').value.trim() || null,
            trustTier: document.getElementById('cTier').value,
          }),
        });
        document.getElementById('tokenNotice').textContent =
          `已创建贡献者 ${res.contributor.name}，请立即复制一次性 Token（之后无法再次查看明文）： ${res.token}`;
        await loadAll();
      } catch (e) {
        alert('创建失败: ' + e.message);
      }
    }

    async function toggleContributor(id, enabled) {
      try {
        await api('/api/v1/admin/contributors/' + encodeURIComponent(id), {
          method: 'PATCH',
          body: JSON.stringify({ enabled: !enabled }),
        });
        await loadAll();
      } catch (e) {
        alert('操作失败: ' + e.message);
      }
    }

    function renderContributors(list) {
      document.getElementById('contribBody').innerHTML = list.map(c => `
        <tr>
          <td>${escapeHtml(c.name)}</td>
          <td>${escapeHtml(c.steamId || '-')}</td>
          <td>${escapeHtml(c.trustTier)}</td>
          <td>${escapeHtml(c.trustWeight)}</td>
          <td>${c.enabled ? '启用' : '已禁用'}</td>
          <td>
            <button
              class="secondary"
              data-action="toggle-contrib"
              data-contrib-id="${escapeHtml(c.id)}"
              data-enabled="${c.enabled ? '1' : '0'}"
            >${c.enabled ? '禁用' : '启用'}</button>
          </td>
        </tr>
      `).join('');
    }

    function renderAudits(list) {
      document.getElementById('auditBody').innerHTML = list.map(a => `
        <tr>
          <td>${escapeHtml(a.createdAt)}</td>
          <td><code>${escapeHtml(a.workshopId)}</code></td>
          <td>${escapeHtml(a.contributorName || '-')}</td>
          <td><span class="badge ${a.decision === 'flagged_for_review' ? 'flagged' : ''}">${escapeHtml(a.decision)}</span></td>
          <td>${escapeHtml(a.submittedStatus)}</td>
          <td>${escapeHtml(a.reason)}</td>
        </tr>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    document.getElementById('btnLoadAll').addEventListener('click', () => { void loadAll(); });
    document.getElementById('btnSearch').addEventListener('click', () => { void searchItems(); });
    document.getElementById('btnOverride').addEventListener('click', () => { void overrideItem(); });
    document.getElementById('btnCreateContrib').addEventListener('click', () => { void createContributor(); });
    document.getElementById('contribBody').addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-action="toggle-contrib"]');
      if (!btn) return;
      const cid = btn.getAttribute('data-contrib-id');
      const enabled = btn.getAttribute('data-enabled') === '1';
      if (cid) {
        void toggleContributor(cid, enabled);
      }
    });
  </script>
</body>
</html>
