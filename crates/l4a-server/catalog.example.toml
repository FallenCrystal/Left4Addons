# Left4Addons Catalog Server 配置文件示例
# 首次运行 `l4a-server` 时若未找到 `./catalog.toml`，会自动生成带随机强密码的默认配置。

[server]
bind = "127.0.0.1:8787"
db_path = "./l4a-catalog.db"

[admin]
username = "admin"
password = "replace-with-strong-admin-password"
session_ttl_hours = 168
# 仅在浏览器直接通过本地 HTTP 调试时设为 true。HTTPS 反代部署保持 false。
allow_insecure_http = false

[steam]
# Left 4 Dead 2 AppID
app_id = 550
# 可选 "anonymous" 或 "account"（也可直接在 Web 控制台中扫码或账号登录并自动写回此文件）
mode = "anonymous"
# account_name = ""
# refresh_token = ""
guard_data_path = "./steam-guard.json"
request_concurrency = 4

[sync]
# 客户端请求未命中或过期时按 ID 穿透核验；按 ID 穿透缓存不会污染公开工坊首页。
enable_read_through = true
item_ttl_secs = 900
# 定时拉取工坊增量更新。目录条目的后台可见性复查独立运行。
enable_incremental_sync = true
incremental_interval_secs = 180
incremental_pages_per_tick = 2
# 可选：后台游标全量归档求生之路 2 创意工坊
enable_backfill = false
backfill_interval_secs = 15
backfill_batch_size = 50

[search]
# 启用 SteamKit CM + 本地索引混合检索（复刻创意工坊网页端排序与多语言匹配）
enable_hybrid_search = true
# 未指定 lang 参数或 Accept-Language 时的默认 Steam 检索语言（如 english / schinese / tchinese）
default_language = "english"
# 单次实时检索 Steam CM 的超时预算（毫秒，超过后自动优雅回退到本地索引）
steam_timeout_ms = 4500
# 实时 Steam 检索页在内存中的短缓存 TTL（秒，0 表示禁用缓存）
cache_ttl_secs = 60
# 将实时检索到的公开条目异步写入按 ID 查询缓存
cache_steam_results = true

[filter]
# 是否对外提供 `/api/v1/filter/predict` 敏感内容概率推理接口（仅返回纯概率，绝不调用任何外部 LLM）
enabled = false
# 推理后端模式："managed_python"（由 l4a-server 自动托管 Left4Filters Python 子进程）或 "upstream_http"
backend = "managed_python"
# ManagedPython 模式下 Left4Filters 仓库目录或 deploy 目录路径
# deploy_dir = "./Left4Filters"
# 可选：指定 Python 解释器路径（留空则自动探测虚拟环境与 python3 / python）
# python_bin = "/opt/left4filters/.venv/bin/python"
# UpstreamHttp 模式下外部推理服务基础地址（需提供 GET /health 与 POST /predict）
# upstream_url = "http://127.0.0.1:8090"
# 概率推理内存缓存 TTL（秒，0..=86400；0 表示禁用缓存）
cache_ttl_secs = 3600
# 模型运行与校准参数（仅允许通过 catalog.toml 或管理员控制台修改，公开 API 客户端无法覆写）
threads = 4
enable_text = true
enable_image = true
max_images = 2
# 多图聚合策略："max" | "top2_mean" | "mean"
gallery_aggregation = "max"
gore_weight = 1.0
nsfw_weight = 1.0
temperature = 1.0
bias = 0.0

